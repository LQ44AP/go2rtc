name: Build and Push

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          # Windows
          - os: windows
            arch: amd64
            ext: .exe
            output: go2rtc-windows-amd64.exe
          - os: windows
            arch: 386
            ext: .exe
            output: go2rtc-windows-386.exe
          - os: windows
            arch: arm64
            ext: .exe
            output: go2rtc-windows-arm64.exe
          # Linux
          - os: linux
            arch: amd64
            ext: ''
            output: go2rtc-linux-amd64
          - os: linux
            arch: 386
            ext: ''
            output: go2rtc-linux-386
          - os: linux
            arch: arm64
            ext: ''
            output: go2rtc-linux-arm64
          - os: linux
            arch: arm
            arm_version: 7
            ext: ''
            output: go2rtc-linux-armv7
          - os: linux
            arch: arm
            arm_version: 6
            ext: ''
            output: go2rtc-linux-armv6
          - os: linux
            arch: mipsle
            gomips: softfloat
            ext: ''
            output: go2rtc-linux-mipsel
          # macOS
          - os: darwin
            arch: amd64
            ext: ''
            output: go2rtc-darwin-amd64
          - os: darwin
            arch: arm64
            ext: ''
            output: go2rtc-darwin-arm64
          # FreeBSD
          - os: freebsd
            arch: amd64
            ext: ''
            output: go2rtc-freebsd-amd64
          - os: freebsd
            arch: arm64
            ext: ''
            output: go2rtc-freebsd-arm64
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      GOARM: ${{ matrix.arm_version }}
      GOMIPS: ${{ matrix.gomips }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'  # 使用实际存在的版本

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      - name: Build
        run: |
          go build -ldflags "-s -w" -trimpath -o ${{ matrix.output }}

      - name: Compress with UPX (optional)
        run: |
          upx --best --lzma ${{ matrix.output }} || true   # 允许失败（某些架构可能不支持）

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    name: Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files (debug)
        run: ls -R artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
