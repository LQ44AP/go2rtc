name: Build go2rtc (from upstream)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 如果需要上传 Release 则保留
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
            output: go2rtc-windows-amd64.exe
          - os: windows
            arch: 386
            ext: .exe
            output: go2rtc-windows-386.exe
          - os: windows
            arch: arm64
            ext: .exe
            output: go2rtc-windows-arm64.exe
          - os: linux
            arch: amd64
            ext: ''
            output: go2rtc-linux-amd64
          - os: linux
            arch: 386
            ext: ''
            output: go2rtc-linux-386
          - os: linux
            arch: arm64
            ext: ''
            output: go2rtc-linux-arm64
          - os: linux
            arch: arm
            arm_version: 7
            ext: ''
            output: go2rtc-linux-armv7
          - os: linux
            arch: arm
            arm_version: 6
            ext: ''
            output: go2rtc-linux-armv6
          - os: linux
            arch: mipsle
            gomips: softfloat
            ext: ''
            output: go2rtc-linux-mipsel
          - os: darwin
            arch: amd64
            ext: ''
            output: go2rtc-darwin-amd64
          - os: darwin
            arch: arm64
            ext: ''
            output: go2rtc-darwin-arm64
          - os: freebsd
            arch: amd64
            ext: ''
            output: go2rtc-freebsd-amd64
          - os: freebsd
            arch: arm64
            ext: ''
            output: go2rtc-freebsd-arm64

    env:
      CGO_ENABLED: 0

    steps:
      # ----- 关键：直接从原仓库拉取代码，而不是您的仓库 -----
      - name: Checkout upstream code
        uses: actions/checkout@v4
        with:
          repository: AlexxIT/go2rtc   # 指定原仓库
          ref: master                  # 可换为指定 tag 或 commit，例如 'v1.9.9'
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'  # 根据原仓库要求调整

      - name: Install UPX (optional)
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm_version }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          go build -ldflags "-s -w" -trimpath -o ${{ matrix.output }}

      - name: UPX compress (ignore errors)
        run: |
          upx --best --lzma ${{ matrix.output }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  # 可选：将全部产物打包上传到 Release（如果您的仓库有 Release）
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
